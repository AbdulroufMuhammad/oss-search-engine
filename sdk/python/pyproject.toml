[project]
name = "seekly"
version = "0.1.0"
description = "Python client for the internal Seekly search API"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seekly*"]
